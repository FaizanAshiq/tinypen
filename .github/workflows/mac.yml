name: mac

on:
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7
      # test.sh wires in the Swift Testing macro plugin when only Command Line Tools are there.
      - run: ./test.sh --no-parallel

  # The Mac app for download, for Apple silicon and Intel, signed with the same release certificate
  # as Tinysnap: macOS keeps Screen Recording, which zoom needs, for an app by its signature, so
  # every version signed alike keeps it. Nothing is released from here.
  package:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Release signing identity
        env:
          IDENTITY: ${{ secrets.MAC_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          [ -n "$IDENTITY" ] || { echo "No MAC_SIGNING_P12 secret: store Tinysnap's release identity in this repo's secrets." >&2; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$IDENTITY" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build
        working-directory: mac
        run: TINYPEN_UNIVERSAL=1 TINYPEN_SIGN_IDENTITY="Tinysnap Release" TINYPEN_REQUIRE_IDENTITY=1 ./build.sh release
      - run: ditto -c -k --keepParent mac/dist/Tinypen.app Tinypen-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Tinypen-mac
          path: Tinypen-mac.zip
          retention-days: 14
      # The same app one version on, signed the same way, for the e2e run to update to.
      - name: Next version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw mac/dist/Tinypen.app/Contents/Info.plist)
          mkdir next
          ditto mac/dist/Tinypen.app next/Tinypen.app
          echo "$version" | awk -F. '{print $1"."$2"."$3+1}' > next/version
          plutil -replace CFBundleShortVersionString -string "$(cat next/version)" next/Tinypen.app/Contents/Info.plist
          codesign --force --sign "Tinysnap Release" next/Tinypen.app
          ditto -c -k --keepParent next/Tinypen.app next/Tinypen-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Tinypen-mac-next
          path: |
            next/Tinypen-mac.zip
            next/version
          retention-days: 14

  # The downloaded app updating itself to the next version, as a person's would.
  e2e:
    needs: package
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Tinypen-mac
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: Tinypen-mac-next
          path: next
      - run: bash mac/e2e/update.sh release/Tinypen-mac.zip next
      - if: always()
        run: cat app.log 2>/dev/null || true
